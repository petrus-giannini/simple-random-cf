<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generatore Codice Fiscale</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&family=Anton&display=swap" rel="stylesheet">
</head>
<body class="theme-acido">

  <!-- Theme slider bar -->
  <div class="theme-bar">
    <span class="theme-bar-label">STILE</span>
    <input type="range" id="theme-slider" min="0" max="2" step="1" value="0">
    <span id="theme-label">Acido</span>
  </div>

  <!-- Main card -->
  <div class="card">
    <div class="badge">IT · Fisco · Tool</div>
    <h1>GENERA<br><span>COD. FISCALE</span></h1>

    <div class="field-group">
      <label class="field-label" for="cf-output">CF</label>
      <div class="cf-wrapper">
        <input type="text" id="cf-output" placeholder="—— —— —— —— —— —" readonly>
        <button class="copy-btn" id="copy-btn" title="Copia negli appunti" aria-label="Copia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
        <div class="copy-tooltip" id="copy-tooltip">COPIATO!</div>
      </div>
    </div>

    <button class="gen-btn" id="gen-btn">⚡ Genera Random CF</button>

    <hr class="divider">

    <p class="footer-note">
      Genera un codice fiscale italiano casuale secondo le regole ufficiali dell'Agenzia delle Entrate.<br>
      <span>Solo a scopo dimostrativo · Non valido ai fini fiscali</span>
    </p>
  </div>

  <script src="app.js"></script>
</body>
</html>
